services:
  postgres:
    image: postgres:16
    container_name: promptforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: promptforge
      POSTGRES_USER: promptforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      TZ: ${TZ:-America/Los_Angeles}
    ports:
      - "127.0.0.1:${PROMPTFORGE_POSTGRES_HOST_PORT:-15439}:5432"
    volumes:
      - promptforge_postgres_data:/var/lib/postgresql/data
      - ./docs/planning/promptforge_postgres_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./docs/planning/promptforge_seed_data.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptforge -d promptforge"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 15s

  n8n:
    image: n8nio/n8n:latest
    container_name: promptforge-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: promptforge
      DB_POSTGRESDB_USER: promptforge
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_EDITOR_BASE_URL: ${WEBHOOK_URL:-${N8N_PROTOCOL}://${N8N_HOST}:${N8N_PORT}/}
      WEBHOOK_URL: ${WEBHOOK_URL:-${N8N_PROTOCOL}://${N8N_HOST}:${N8N_PORT}/}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change_me_local_dev}
      GENERIC_TIMEZONE: ${TZ:-America/Los_Angeles}
      TZ: ${TZ:-America/Los_Angeles}
      EXECUTIONS_MODE: regular
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
    ports:
      - "127.0.0.1:${PROMPTFORGE_N8N_PORT:-5678}:5678"
    volumes:
      - promptforge_n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s

  promptforge-shim:
    build:
      context: .
      dockerfile: Dockerfile.shim
      args:
        CODEX_VERSION: ${PROMPTFORGE_CODEX_VERSION:-latest}
    container_name: promptforge-shim
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      - type: bind
        source: ${CODEX_AUTH_DIR:-/home/nate/.codex}/auth.json
        target: /root/.codex/auth.json
        read_only: true
    ports:
      - "127.0.0.1:${PROMPTFORGE_SHIM_PORT:-8765}:8765"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=3).read()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  promptforge-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: promptforge-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      promptforge-shim:
        condition: service_healthy
    environment:
      PROMPTFORGE_HOST: 0.0.0.0
      PROMPTFORGE_PORT: 8090
      PROMPTFORGE_DATABASE_URL: postgresql://promptforge:${POSTGRES_PASSWORD:-change_me}@postgres:5432/promptforge
      PROMPTFORGE_VAULT_PATH: /vault
      PROMPTFORGE_WATCH_FOLDER: ${PROMPTFORGE_WATCH_FOLDER:-Inbox/Voice}
      PROMPTFORGE_PROCESSED_FOLDER: ${PROMPTFORGE_PROCESSED_FOLDER:-Processed/Voice}
      PROMPTFORGE_ERROR_FOLDER: ${PROMPTFORGE_ERROR_FOLDER:-Processing/Error}
      PROMPTFORGE_WEBHOOK_ENABLED: ${PROMPTFORGE_WEBHOOK_ENABLED:-false}
      PROMPTFORGE_N8N_WEBHOOK_URL: ${N8N_PROTOCOL}://n8n:${N8N_PORT}/webhook/promptforge-intake
      # Kanban runs on the host, not in Docker.
      # Inside this container, host.docker.internal is the host's localhost.
      # That means a host Kanban at localhost:3484 is reachable here as host.docker.internal:3484.
      PROMPTFORGE_KANBAN_BASE_URL: ${PROMPTFORGE_KANBAN_BASE_URL:-http://host.docker.internal:3484}
      PROMPTFORGE_KANBAN_WORKSPACE_ID: ${PROMPTFORGE_KANBAN_WORKSPACE_ID:-}
      PROMPTFORGE_LLM_ENABLED: ${PROMPTFORGE_LLM_ENABLED:-false}
      PROMPTFORGE_LLM_MODE: ${PROMPTFORGE_LLM_MODE:-deterministic_only}
      PROMPTFORGE_LLM_REVIEW_PROVIDER: ${PROMPTFORGE_LLM_REVIEW_PROVIDER:-openai_compatible}
      PROMPTFORGE_LLM_INFERENCE_PROVIDER: ${PROMPTFORGE_LLM_INFERENCE_PROVIDER:-openai_compatible}
      PROMPTFORGE_OPENAI_COMPAT_BASE_URL: ${PROMPTFORGE_OPENAI_COMPAT_BASE_URL:-http://promptforge-shim:8765/v1}
      PROMPTFORGE_OPENAI_COMPAT_MODEL: ${PROMPTFORGE_OPENAI_COMPAT_MODEL:-codex}
      TZ: ${TZ:-America/Los_Angeles}
    ports:
      - "127.0.0.1:${PROMPTFORGE_PORT:-8090}:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/app
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/_healthz', timeout=3).read()\"",
        ]
      interval: 60s
      timeout: 5s
      retries: 10
      start_period: 15s

  promptforge-watcher:
    build:
      context: .
      dockerfile: Dockerfile.watcher
    container_name: promptforge-watcher
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      promptforge-api:
        condition: service_healthy
      promptforge-shim:
        condition: service_healthy
      n8n:
        condition: service_healthy
    environment:
      PROMPTFORGE_DATABASE_URL: postgresql://promptforge:${POSTGRES_PASSWORD:-change_me}@postgres:5432/promptforge
      PROMPTFORGE_VAULT_PATH: /vault
      PROMPTFORGE_WATCH_FOLDER: ${PROMPTFORGE_WATCH_FOLDER:-Inbox/Voice}
      PROMPTFORGE_PROCESSED_FOLDER: ${PROMPTFORGE_PROCESSED_FOLDER:-Processed/Voice}
      PROMPTFORGE_ERROR_FOLDER: ${PROMPTFORGE_ERROR_FOLDER:-Processing/Error}
      PROMPTFORGE_N8N_WEBHOOK_URL: http://n8n:5678/webhook/promptforge-intake
      # Same host-bridge rule for the watcher container.
      PROMPTFORGE_KANBAN_BASE_URL: ${PROMPTFORGE_KANBAN_BASE_URL:-http://host.docker.internal:3484}
      PROMPTFORGE_KANBAN_WORKSPACE_ID: ${PROMPTFORGE_KANBAN_WORKSPACE_ID:-}
      PROMPTFORGE_WEBHOOK_ENABLED: ${PROMPTFORGE_WEBHOOK_ENABLED:-true}
      PROMPTFORGE_STABILIZATION_SECONDS: ${PROMPTFORGE_STABILIZATION_SECONDS:-0.5}
      PROMPTFORGE_LLM_ENABLED: ${PROMPTFORGE_LLM_ENABLED:-false}
      PROMPTFORGE_LLM_MODE: ${PROMPTFORGE_LLM_MODE:-deterministic_only}
      PROMPTFORGE_LLM_REVIEW_PROVIDER: ${PROMPTFORGE_LLM_REVIEW_PROVIDER:-openai_compatible}
      PROMPTFORGE_LLM_INFERENCE_PROVIDER: ${PROMPTFORGE_LLM_INFERENCE_PROVIDER:-openai_compatible}
      PROMPTFORGE_OPENAI_COMPAT_BASE_URL: ${PROMPTFORGE_OPENAI_COMPAT_BASE_URL:-http://promptforge-shim:8765/v1}
      PROMPTFORGE_OPENAI_COMPAT_MODEL: ${PROMPTFORGE_OPENAI_COMPAT_MODEL:-codex}
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      - ./:/app
      - type: bind
        source: ${PROMPTFORGE_VAULT_SOURCE:-/lump/share/media/development}
        target: /vault
        bind:
          create_host_path: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/usr/local/bin/watcher_entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /proc/1/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  promptforge-console:
    build:
      context: ../prompt-forge-console
      dockerfile: Dockerfile
      args:
        VITE_PROMPTFORGE_API_BASE: ${PROMPTFORGE_CONSOLE_API_BASE:-http://localhost:8090}
    container_name: promptforge-console
    restart: unless-stopped
    depends_on:
      promptforge-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PROMPTFORGE_CONSOLE_PORT:-5174}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  promptforge_postgres_data:
  promptforge_n8n_data:
